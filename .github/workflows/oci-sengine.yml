# Builds this fork's COSI controller image into the org OCI registry.
#
# The sengine branch is upstream v0.2.2 plus one fix: the BucketClaim status
# write could set bucketReady back to false after the sidecar had set it, which
# left claims not ready and their BucketAccesses ungranted
# (sengine-cloud/fluxcd-infra#450). Drop this fork once an upstream release
# carries the fix.
#
# workflow_dispatch only, deliberately. This repo is a PUBLIC fork, and the org
# OCI credential is visible to every repo in the org, so there must be no event
# here that an outside contributor can trigger. No pull_request, no push.
#
# Runs on a GitHub-hosted runner: public repos cannot reach the shared ARC pool.
name: oci-image (sengine)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to this branch)
        required: false
        default: ""

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: "false" # buildx otherwise uploads a *.dockerbuild artifact per run
  IMAGE_NAME: objectstorage-controller

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Same unit tests as upstream's `make test.controller`, so an image is
      # never pushed from a tree whose tests fail.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test controller
        working-directory: controller
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the org OCI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCI_REGISTRY_HOST }}
          username: ${{ vars.OCI_REGISTRY_LOGIN }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # No :latest. The image is pinned by digest in fluxcd-infra, and a
      # floating tag on a fork invites exactly the drift the pin exists to stop.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./controller/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.OCI_REGISTRY_HOST }}/${{ vars.OCI_REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}

      - name: Report the digest to pin
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ vars.OCI_REGISTRY_HOST }}/${{ vars.OCI_REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
